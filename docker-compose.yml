# Starts PostgreSQL + the app (API and built React UI) together:
#   docker compose up --build
# Then open http://localhost:5000   (demo: demo@sweety.app / Demo@1234 after seeding)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_dev_password
      POSTGRES_DB: sweety
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://sweety:sweety_dev_password@db:5432/sweety
      JWT_SECRET: change-me-in-real-deployments
      CLIENT_ORIGIN: http://localhost:5000
      SERVE_CLIENT: "true"
    ports:
      - "5000:5000"

volumes:
  pgdata:
